<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel personal</title>
<meta name="description" content="Tu panel personal: tiempo, dinero, estudio y entreno en un solo lugar.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<a class="skip-link" href="#view">Saltar al contenido</a>

<!-- ===================== ACCESO ===================== -->
<div id="auth-screen">
  <form class="auth-card" id="auth-form" novalidate>
    <img class="auth-logo" src="assets/icon-192.png" alt="" width="56" height="56">
    <h1 id="auth-title">Iniciar sesión</h1>
    <p class="tagline">¿Qué deberías estar haciendo ahora?</p>
    <div class="field">
      <label for="auth-email">Correo</label>
      <input type="email" id="auth-email" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label for="auth-password">Contraseña</label>
      <input type="password" id="auth-password" autocomplete="current-password">
    </div>
    <button class="btn primary block" id="auth-submit" type="submit">Entrar</button>
    <button class="btn ghost block" id="auth-toggle" type="button">¿No tienes cuenta? Crea una</button>
    <p class="form-error" id="auth-error" role="alert"></p>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <nav class="nav" id="nav" aria-label="Principal">
    <div class="brand"><img src="assets/favicon-32.png" alt="" width="28" height="28"><span>Panel</span></div>
    <div class="nav-items" id="nav-items"></div>
    <a class="nav-settings" href="#/ajustes" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Ajustes</span></a>
  </nav>

  <div class="main-col">
    <header class="topbar">
      <div>
        <h1 id="greeting">Hola</h1>
        <p id="today-line"></p>
      </div>
      <a class="icon-btn only-mobile" href="#/ajustes" aria-label="Ajustes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <button class="fab" data-act="quick.open" type="button" aria-label="Agregar rápido"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div id="sheet-root" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
